<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Drop Dates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a big month on a loose grid, with the selected day's list beside it (below on phones) and a "next up" strip so the next deadline is never a surprise. */
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface2:#E9EBF8; --ink:#14142B; --muted:#5E6088; --line:#DCDEEF;
  --accent:#3A2EF2; --on-accent:#FFFFFF;
  --shoot:#D9401C; --publish:#0A8A6E; --meeting:#7040F2; --deadline:#CF1C73; --personal:#A87500;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F1F; --surface:#17182F; --surface2:#202243; --ink:#ECEDFA; --muted:#9FA1C8; --line:#2B2D50;
    --accent:#8C84FF; --on-accent:#0E0F1F;
    --shoot:#FF7B57; --publish:#34D3A8; --meeting:#AE92FF; --deadline:#FF5FA6; --personal:#F2C14E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F1F; --surface:#17182F; --surface2:#202243; --ink:#ECEDFA; --muted:#9FA1C8; --line:#2B2D50;
  --accent:#8C84FF; --on-accent:#0E0F1F;
  --shoot:#FF7B57; --publish:#34D3A8; --meeting:#AE92FF; --deadline:#FF5FA6; --personal:#F2C14E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.c-shoot{--c:var(--shoot)} .c-publish{--c:var(--publish)} .c-meeting{--c:var(--meeting)} .c-deadline{--c:var(--deadline)} .c-personal{--c:var(--personal)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:16px}
.titleblock{min-width:0}
.eyebrow{margin:0 0 4px;font:500 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:800 clamp(34px,7vw,56px)/1 var(--font-display);letter-spacing:-.025em;text-wrap:balance}
h1 .yr{font-weight:500;color:var(--muted)}
.stats{margin:8px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.nav{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
.btn{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2)}
.seg button{border:0;background:transparent;min-height:34px;padding:0 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,20,43,.14)}

.notice{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--surface2);color:var(--ink);font-size:14px}

.nextup{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;width:100%;text-align:left;margin-bottom:14px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.nextup:hover{border-color:var(--accent)}
.nextup .lbl{font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.nextup .what{font-weight:700;min-width:0;overflow-wrap:anywhere}
.nextup .when{color:var(--muted);font-size:14px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* month */
.month{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:980px){.month{grid-template-columns:minmax(0,1fr) 340px}}
.calwrap{min-width:0}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{margin-bottom:4px}
.dow span{padding:0 6px;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cell{min-width:0;min-height:60px;padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cell:hover{border-color:var(--accent)}
.cell.other{background:transparent;color:var(--muted)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-1px}
.num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.today .num{background:var(--accent);color:var(--on-accent)}
.chips{display:none}
.dots{display:flex;flex-wrap:wrap;gap:3px;padding-left:2px}
.dots .dot{width:7px;height:7px}
.dots .dot.done{opacity:.35}
.chip{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 6px;border-radius:6px;font-size:12px;line-height:1.35;background:color-mix(in srgb,var(--c) 17%,var(--surface))}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done span{text-decoration:line-through;opacity:.6}
.chip .dot{width:6px;height:6px}
.more{font-size:12px;color:var(--muted);padding-left:6px}
@media (min-width:720px){
  .cell{min-height:108px}
  .chips{display:flex;flex-direction:column;gap:3px;min-width:0}
  .dots{display:none}
}

/* day panel and cards */
.panel{min-width:0;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panelhead h2{margin:0;font:800 22px/1.1 var(--font-display);letter-spacing:-.01em}
.panelhead .sub{margin:4px 0 0;font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);min-width:0}
.check{flex:none;width:28px;height:28px;margin-top:2px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;color:transparent}
.check:hover{border-color:var(--c)}
.check[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.check[disabled]{cursor:default}
.evbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:transparent;padding:0}
.evtop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 17%,var(--surface))}
.time{font:400 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.evtitle{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.ev.done .evtitle{text-decoration:line-through;color:var(--muted)}
.evwhere{font-size:13px;color:var(--muted)}
.evnotes{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.empty{margin:0;padding:18px 4px 6px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:800 18px var(--font-display);margin-bottom:4px}

/* up next */
.agenda{max-width:720px}
.group{margin-bottom:22px}
.grouphead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font:800 20px var(--font-display);letter-spacing:-.01em}
.grouphead span{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* editor sheet */
.sheetwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.scrim{position:absolute;inset:0;background:rgba(10,10,30,.55)}
.sheet{position:relative;width:100%;max-width:540px;max-height:100%;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheetwrap{align-items:center}.sheet{border-radius:20px;padding-bottom:20px}}
.sheet h2{margin:0 0 14px;font:800 24px/1.1 var(--font-display);letter-spacing:-.01em}
.sheet fieldset{border:0;margin:0;padding:0;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.field>label,.field>legend,.lab{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0}
.input{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row .field{flex:1 1 120px}
.row .field.wide{flex:2 1 170px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catpick{position:relative}
.catpick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.catpick span{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:600}
.catpick input:checked+span{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-color:var(--c)}
.catpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{margin:0 0 12px;color:var(--deadline);font-weight:600;font-size:14px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.actions .grow{flex:1 1 auto}
.btn.danger.armed{background:var(--deadline);border-color:var(--deadline);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){
  .toast{transition:opacity .2s,transform .2s}
  .check{transition:background .15s,border-color .15s,color .15s,transform .15s}
  .check[aria-pressed="true"]{transform:scale(1.08)}
  .cell,.btn,.fchip,.nextup{transition:border-color .15s,background .15s}
}
</style>

<div class="page">
  <header class="top">
    <div class="titleblock">
      <p class="eyebrow">Drop Dates</p>
      <h1 id="title"></h1>
      <p id="stats" class="stats"></p>
    </div>
    <div class="controls">
      <div class="nav" id="nav">
        <button type="button" class="iconbtn" id="prev" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="btn" id="todayBtn">Today</button>
        <button type="button" class="iconbtn" id="next" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="modeMonth" aria-pressed="true">Month</button>
        <button type="button" id="modeAgenda" aria-pressed="false">Up next</button>
      </div>
      <button type="button" class="btn primary" id="addTop">Add event</button>
    </div>
  </header>

  <p id="notice" class="notice" hidden></p>
  <button type="button" class="nextup" id="nextup" hidden></button>
  <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>

  <main>
    <section class="month" id="monthView">
      <div class="calwrap">
        <div class="dow" id="dow"></div>
        <div class="grid" id="grid"></div>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </section>
    <section class="agenda" id="agendaView" hidden></section>
  </main>
</div>

<div class="sheetwrap" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="evform" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">New event</h2>
    <fieldset id="fields">
      <div class="field">
        <label for="f-title">What is it?</label>
        <input class="input" id="f-title" maxlength="120" autocomplete="off" placeholder="Reel shoot, newsletter send, brand call">
      </div>
      <div class="row">
        <div class="field wide"><label for="f-date">Date</label><input class="input" type="date" id="f-date"></div>
        <div class="field"><label for="f-start">Starts</label><input class="input" type="time" id="f-start"></div>
        <div class="field"><label for="f-end">Ends</label><input class="input" type="time" id="f-end"></div>
      </div>
      <div class="field">
        <span class="lab" id="catlab">Type</span>
        <div class="cats" id="cats" role="radiogroup" aria-labelledby="catlab"></div>
      </div>
      <div class="field">
        <label for="f-where">Where or which channel</label>
        <input class="input" id="f-where" maxlength="80" autocomplete="off" placeholder="Instagram, TikTok, studio, Zoom">
      </div>
      <div class="field">
        <label for="f-notes">Notes</label>
        <textarea class="input" id="f-notes" maxlength="1000" placeholder="Caption ideas, props, links, who is involved"></textarea>
      </div>
    </fieldset>
    <p class="err" id="f-err" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="btnDel" hidden>Delete</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="btnCancel">Close</button>
      <button type="submit" class="btn primary" id="btnSave">Save</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var CATS=[['shoot','Shoot'],['publish','Publish'],['meeting','Meeting'],['deadline','Deadline'],['personal','Personal']];
  var CATMAP={}; CATS.forEach(function(c){CATMAP[c[0]]=c[1]});
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var DOWL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var CHECK='<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return String(n).padStart(2,'0')};
  var ymd=function(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)};
  var dateOf=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
  var todayStr=function(){var t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate())};
  var dowIdx=function(dt){return (dt.getDay()+6)%7};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function fmtT(t){var p=t.split(':').map(Number);var h=p[0]%12||12;return h+(p[1]?':'+pad(p[1]):'')+(p[0]<12?' am':' pm')}
  function fmtShort(s){var d=dateOf(s);return DOW[dowIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
  function rel(s){
    var diff=Math.round((dateOf(s)-dateOf(todayStr()))/864e5);
    if(diff===0)return 'Today'; if(diff===1)return 'Tomorrow';
    if(diff>1&&diff<7)return DOWL[dowIdx(dateOf(s))];
    return fmtShort(s);
  }
  function timeLabel(e){return e.start?fmtT(e.start)+(e.end?' to '+fmtT(e.end):''):'All day'}
  function cmp(a,b){return a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'')||a.title.localeCompare(b.title)}

  var events=[], store=null, localMode=false, canWrite=true, loaded=false, notice='';
  var now=new Date();
  var view={y:now.getFullYear(),m:now.getMonth()};
  var selected=todayStr(), filter='all', mode='month', editing=null, lastFocus=null, armTimer=null, toastTimer=null;

  /* storage */
  var LS='dropdates.events.v1';
  var SEED=[
    {id:'moa-scout-mon',title:'Mall of Arabia scouting',date:'2026-10-19',start:'',end:'',cat:'shoot',where:'Mall of Arabia',notes:'',done:false,createdAt:1},
    {id:'moa-scout-tue',title:'Mall of Arabia scouting',date:'2026-10-20',start:'12:00',end:'',cat:'shoot',where:'Mall of Arabia',notes:'',done:false,createdAt:2},
    {id:'fornalia-wed',title:'Fornalia',date:'2026-10-21',start:'',end:'',cat:'meeting',where:'',notes:'',done:false,createdAt:3},
    {id:'nadarty-thu',title:'Nadarty',date:'2026-10-22',start:'',end:'',cat:'meeting',where:'',notes:'',done:false,createdAt:4},
    {id:'woman-purpose-fri',title:'Woman with Purpose',date:'2026-10-23',start:'12:00',end:'',cat:'meeting',where:'',notes:'',done:false,createdAt:5}
  ];
  function loadLocal(){try{var r=localStorage.getItem(LS);if(r===null){events=SEED.slice();saveLocal();return events}var a=JSON.parse(r);return Array.isArray(a)?a:[]}catch(e){return SEED.slice()}}
  function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(events))}catch(e){}}
  function clean(id,d){
    if(!d||typeof d.title!=='string'||typeof d.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d.date))return null;
    return {id:id,title:d.title,date:d.date,start:typeof d.start==='string'?d.start:'',end:typeof d.end==='string'?d.end:'',cat:CATMAP[d.cat]?d.cat:'personal',where:typeof d.where==='string'?d.where:'',notes:typeof d.notes==='string'?d.notes:'',done:!!d.done,createdAt:d.createdAt||0};
  }
  function saveEvent(ev){
    if(store){var d=Object.assign({},ev);delete d.id;return store.collection('events').doc(ev.id).set(d)}
    var i=events.findIndex(function(x){return x.id===ev.id});
    if(i>=0)events[i]=ev;else events.push(ev);
    saveLocal();render();return Promise.resolve();
  }
  function removeEvent(id){
    if(store)return store.collection('events').doc(id).delete();
    events=events.filter(function(x){return x.id!==id});saveLocal();render();return Promise.resolve();
  }
  var newId=function(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};

  /* helpers for views */
  function visible(){return events.filter(function(e){return filter==='all'||e.cat===filter})}
  function byDate(list){var m={};list.forEach(function(e){(m[e.date]=m[e.date]||[]).push(e)});Object.keys(m).forEach(function(k){m[k].sort(cmp)});return m}
  function evCard(e){
    var c=CATMAP[e.cat]?e.cat:'personal';
    return '<article class="ev c-'+c+(e.done?' done':'')+'">'+
      '<button type="button" class="check" data-done="'+esc(e.id)+'" aria-pressed="'+(e.done?'true':'false')+'" aria-label="'+(e.done?'Mark not done: ':'Mark done: ')+esc(e.title)+'"'+(canWrite?'':' disabled')+'>'+CHECK+'</button>'+
      '<button type="button" class="evbody" data-edit="'+esc(e.id)+'">'+
        '<span class="evtop"><span class="tag"><i class="dot"></i>'+CATMAP[c]+'</span><span class="time">'+timeLabel(e)+'</span></span>'+
        '<span class="evtitle">'+esc(e.title)+'</span>'+
        (e.where?'<span class="evwhere">'+esc(e.where)+'</span>':'')+
        (e.notes?'<span class="evnotes">'+esc(e.notes)+'</span>':'')+
      '</button></article>';
  }
  function nextUp(){
    var t=todayStr(),n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());
    var c=events.filter(function(e){
      if(e.done)return false;
      if(e.date>t)return true;
      if(e.date<t)return false;
      return !e.start||((e.end||e.start)>=hm);
    }).sort(cmp);
    return c[0]||null;
  }

  /* render */
  function render(){
    var t=todayStr();
    var agenda=mode==='agenda';
    $('modeMonth').setAttribute('aria-pressed',agenda?'false':'true');
    $('modeAgenda').setAttribute('aria-pressed',agenda?'true':'false');
    $('nav').hidden=agenda;
    $('monthView').hidden=agenda;
    $('agendaView').hidden=!agenda;
    $('addTop').hidden=!canWrite;
    var nb=$('notice');nb.hidden=!notice;nb.textContent=notice;

    var upcomingAll=events.filter(function(e){return e.date>=t});
    if(agenda){
      $('title').innerHTML='Up next';
      $('stats').textContent=upcomingAll.length?upcomingAll.length+' coming up':'Nothing coming up yet';
    }else{
      $('title').innerHTML=MONTHS[view.m]+' <span class="yr">'+view.y+'</span>';
      var pre=view.y+'-'+pad(view.m+1)+'-';
      var inMonth=events.filter(function(e){return e.date.indexOf(pre)===0});
      var done=inMonth.filter(function(e){return e.done}).length;
      $('stats').textContent=!loaded?'Loading your calendar':inMonth.length?inMonth.length+(inMonth.length>1?' events':' event')+' this month, '+done+' done':'Nothing planned this month';
    }

    var nu=nextUp(),nb2=$('nextup');
    if(nu){
      nb2.hidden=false;nb2.setAttribute('data-edit',nu.id);
      nb2.innerHTML='<span class="lbl">Next up</span><span class="what">'+esc(nu.title)+'</span><span class="when">'+rel(nu.date)+(nu.start?', '+fmtT(nu.start):'')+'</span>';
    }else{nb2.hidden=true;nb2.removeAttribute('data-edit')}

    var f='<button type="button" class="fchip" data-filter="all" aria-pressed="'+(filter==='all')+'">All</button>';
    CATS.forEach(function(c){f+='<button type="button" class="fchip c-'+c[0]+'" data-filter="'+c[0]+'" aria-pressed="'+(filter===c[0])+'"><i class="dot"></i>'+c[1]+'</button>'});
    $('filters').innerHTML=f;

    if(agenda)renderAgenda();else{renderGrid();renderPanel()}
  }

  function renderGrid(){
    var t=todayStr();
    var first=new Date(view.y,view.m,1),offset=dowIdx(first);
    var dim=new Date(view.y,view.m+1,0).getDate();
    var rows=Math.ceil((offset+dim)/7);
    var map=byDate(visible());
    var h='';
    for(var i=0;i<rows*7;i++){
      var d=new Date(view.y,view.m,1-offset+i);
      var s=ymd(d.getFullYear(),d.getMonth(),d.getDate());
      var list=map[s]||[];
      var cls='cell'+(d.getMonth()!==view.m?' other':'')+(s===t?' today':'')+(s===selected?' sel':'');
      var chips='',dots='';
      list.slice(0,2).forEach(function(e){chips+='<span class="chip c-'+e.cat+(e.done?' done':'')+'"><i class="dot"></i><span>'+esc(e.title)+'</span></span>'});
      if(list.length>2)chips+='<span class="more">+'+(list.length-2)+' more</span>';
      list.slice(0,4).forEach(function(e){dots+='<i class="dot c-'+e.cat+(e.done?' done':'')+'"></i>'});
      h+='<button type="button" class="'+cls+'" data-d="'+s+'" aria-label="'+DOWL[dowIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+', '+(list.length?list.length+(list.length>1?' events':' event'):'nothing planned')+'"'+(s===selected?' aria-current="date"':'')+'>'+
        '<span class="num">'+d.getDate()+'</span><span class="chips">'+chips+'</span><span class="dots">'+dots+'</span></button>';
    }
    $('grid').innerHTML=h;
    if(!$('dow').firstChild){$('dow').innerHTML=DOW.map(function(x){return '<span>'+x+'</span>'}).join('')}
  }

  function renderPanel(){
    var d=dateOf(selected),t=todayStr();
    var list=visible().filter(function(e){return e.date===selected}).sort(cmp);
    var h='<div class="panelhead"><div><h2>'+DOWL[dowIdx(d)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+'</h2>'+(selected===t?'<p class="sub">Today</p>':'<p class="sub">'+rel(selected)+'</p>')+'</div>'+(canWrite?'<button type="button" class="btn primary" data-add="1">Add</button>':'')+'</div>';
    if(!loaded){h+='<p class="empty">Loading your calendar.</p>'}
    else if(!list.length){
      var any=events.some(function(e){return e.date===selected});
      h+='<p class="empty"><strong>'+(any?'Nothing in this filter':'Nothing planned')+'</strong>'+(any?'Switch the filter to All to see the rest of the day.':(canWrite?'Add a shoot, a post, a call or a deadline for this day.':'Nothing has been added for this day.'))+'</p>';
    }else{h+='<div class="list">'+list.map(evCard).join('')+'</div>'}
    $('panel').innerHTML=h;
  }

  function renderAgenda(){
    var t=todayStr();
    var list=visible().filter(function(e){return e.date>=t}).sort(cmp);
    if(!loaded){$('agendaView').innerHTML='<p class="empty">Loading your calendar.</p>';return}
    if(!list.length){$('agendaView').innerHTML='<p class="empty"><strong>Nothing coming up</strong>'+(canWrite?'Tap Add event to plan the next shoot, post or deadline.':'Nothing has been added yet.')+'</p>';return}
    var h='',cur='';
    list.forEach(function(e){
      if(e.date!==cur){if(cur)h+='</div></section>';cur=e.date;h+='<section class="group"><h3 class="grouphead">'+rel(e.date)+(rel(e.date)!==fmtShort(e.date)?'<span>'+fmtShort(e.date)+'</span>':'')+'</h3><div class="list">'}
      h+=evCard(e);
    });
    h+='</div></section>';
    $('agendaView').innerHTML=h;
  }

  /* toast */
  function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2600)}

  /* editor */
  function buildCats(){
    $('cats').innerHTML=CATS.map(function(c,i){return '<label class="catpick c-'+c[0]+'"><input type="radio" name="cat" value="'+c[0]+'"'+(i===0?' checked':'')+'><span><i class="dot"></i>'+c[1]+'</span></label>'}).join('');
  }
  function showErr(msg,focusEl){var e=$('f-err');e.textContent=msg;e.hidden=false;if(focusEl)focusEl.focus()}
  function resetArm(){clearTimeout(armTimer);var b=$('btnDel');b.classList.remove('armed');b.textContent='Delete'}
  function openSheet(id,date){
    var ev=id?events.find(function(x){return x.id===id}):null;
    if(id&&!ev)return;
    if(!id&&!canWrite)return;
    lastFocus=document.activeElement;
    editing={id:id||null};
    $('sheetTitle').textContent=!canWrite?'Event':ev?'Edit event':'New event';
    $('f-title').value=ev?ev.title:'';
    $('f-date').value=ev?ev.date:(date||selected);
    $('f-start').value=ev?ev.start:'';
    $('f-end').value=ev?ev.end:'';
    $('f-where').value=ev?ev.where:'';
    $('f-notes').value=ev?ev.notes:'';
    var cat=ev?ev.cat:(filter!=='all'?filter:'shoot');
    var r=document.querySelector('input[name="cat"][value="'+cat+'"]');if(r)r.checked=true;
    $('fields').disabled=!canWrite;
    $('btnSave').hidden=!canWrite;
    $('btnDel').hidden=!(ev&&canWrite);
    $('btnCancel').textContent=canWrite?'Cancel':'Close';
    $('f-err').hidden=true;resetArm();
    $('sheet').hidden=false;
    if(canWrite)setTimeout(function(){$('f-title').focus()},0);else $('btnCancel').focus();
  }
  function closeSheet(){
    $('sheet').hidden=true;editing=null;resetArm();
    if(lastFocus&&lastFocus.isConnected&&lastFocus.focus)lastFocus.focus();
  }
  function writeError(err){
    var code=err&&err.code;
    if(code==='invalid_argument'){canWrite=false;notice='View only. Ask the calendar owner for edit access.';render();return 'You can view this calendar but not change it. Ask the owner for edit access.'}
    if(code==='quota_exceeded')return 'This calendar is full. Delete some old events to make room.';
    return 'That did not save. Check your connection and try again.';
  }

  $('evform').addEventListener('submit',function(e){
    e.preventDefault();
    if(!canWrite||!editing)return;
    var title=$('f-title').value.trim(),date=$('f-date').value,start=$('f-start').value,end=$('f-end').value;
    if(!title)return showErr('Give the event a title.',$('f-title'));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return showErr('Pick a date.',$('f-date'));
    if(end&&!start)return showErr('Add a start time, or clear the end time.',$('f-start'));
    if(start&&end&&end<start)return showErr('The end time is before the start time.',$('f-end'));
    var catEl=document.querySelector('input[name="cat"]:checked');
    var id=editing.id||newId();
    var prev=events.find(function(x){return x.id===id});
    var obj={id:id,title:title,date:date,start:start,end:end,cat:catEl?catEl.value:'personal',where:$('f-where').value.trim(),notes:$('f-notes').value.trim(),done:prev?!!prev.done:false,createdAt:prev&&prev.createdAt?prev.createdAt:Date.now()};
    var btn=$('btnSave');btn.disabled=true;
    saveEvent(obj).then(function(){
      var d=dateOf(date);selected=date;view={y:d.getFullYear(),m:d.getMonth()};
      closeSheet();render();toast(prev?'Saved':'Added for '+fmtShort(date));
    }).catch(function(err){showErr(writeError(err))}).then(function(){btn.disabled=false});
  });
  $('btnCancel').addEventListener('click',closeSheet);
  $('scrim').addEventListener('click',closeSheet);
  $('btnDel').addEventListener('click',function(){
    var b=$('btnDel');
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to delete';clearTimeout(armTimer);armTimer=setTimeout(resetArm,4000);return}
    if(!editing||!editing.id)return;
    b.disabled=true;
    removeEvent(editing.id).then(function(){closeSheet();toast('Deleted')}).catch(function(err){showErr(writeError(err));resetArm()}).then(function(){b.disabled=false});
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});

  /* navigation and clicks */
  function shiftMonth(n){var d=new Date(view.y,view.m+n,1);view={y:d.getFullYear(),m:d.getMonth()};render()}
  $('prev').addEventListener('click',function(){shiftMonth(-1)});
  $('next').addEventListener('click',function(){shiftMonth(1)});
  $('todayBtn').addEventListener('click',function(){var n=new Date();view={y:n.getFullYear(),m:n.getMonth()};selected=todayStr();render()});
  $('modeMonth').addEventListener('click',function(){mode='month';render()});
  $('modeAgenda').addEventListener('click',function(){mode='agenda';render()});
  $('addTop').addEventListener('click',function(){openSheet(null,mode==='month'?selected:todayStr())});

  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-d],[data-done],[data-edit],[data-add],[data-filter]');
    if(!t)return;
    if(t.hasAttribute('data-filter')){filter=t.getAttribute('data-filter');render();var b=document.querySelector('[data-filter="'+filter+'"]');if(b)b.focus();return}
    if(t.hasAttribute('data-add')){openSheet(null,selected);return}
    if(t.hasAttribute('data-done')){
      var id=t.getAttribute('data-done'),ev=events.find(function(x){return x.id===id});
      if(!ev||!canWrite)return;
      saveEvent(Object.assign({},ev,{done:!ev.done})).catch(function(err){toast(writeError(err))});
      return;
    }
    if(t.hasAttribute('data-edit')){openSheet(t.getAttribute('data-edit'));return}
    if(t.hasAttribute('data-d')){
      var s=t.getAttribute('data-d'),d=dateOf(s);selected=s;
      if(d.getMonth()!==view.m||d.getFullYear()!==view.y)view={y:d.getFullYear(),m:d.getMonth()};
      render();
      var c=document.querySelector('[data-d="'+s+'"]');if(c)c.focus({preventScroll:true});
      if(window.innerWidth<980){var p=$('panel');if(p&&p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
    }
  });

  /* boot */
  buildCats();
  render();
  async function boot(){
    var db=null,user=null,cl=window.claude;
    db=null;
    try{user=cl&&cl.use?await cl.use('user'):null}catch(e){user=null}
    if(user&&db){try{var w=await user.can('data.write');if(w===false){canWrite=false;notice='View only. Ask the calendar owner for edit access.'}}catch(e){}}
    if(db){
      store=db;
      db.collection('events').onSnapshot(function(snap){
        events=snap.docs.map(function(d){return clean(d.id,d.data())}).filter(Boolean);
        loaded=true;render();
      },function(err){
        loaded=true;notice='The calendar could not be loaded right now. Reload the page to try again.';render();
      });
    }else{
      localMode=true;events=loadLocal();loaded=true;
      notice='Events are saved in this browser on this device only.';
      render();
    }
  }
  boot();
})();
</script>

</body></html>
